name: Test and Deploy AllTool

on:
  push:
    paths:
      - 'AllTool/AllTool.py'
  pull_request:
    paths:
      - 'AllTool/AllTool.py'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 pytest

      - name: Run Pylint
        run: |
          pylint AllTool/AllTool.py

      - name: Run Flake8
        run: |
          flake8 AllTool/AllTool.py

      - name: Run Pytest
        run: |
          pytest AllTool/AllTool.py

      - name: Deploy AllTool
        if: success()
        run: echo "Deploying AllTool.py..."
